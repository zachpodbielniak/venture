# VENTURE default configuration
#
# This file is compiled into the venture binary, so a fresh install works
# with no configuration at all. `venture --generate-config` writes a copy of
# it that you can edit.
#
# Configuration is resolved in this order, later sources overriding earlier
# ones field by field:
#
#   1. these built-in defaults
#   2. /etc/venture/config.yaml
#   3. $XDG_CONFIG_HOME/venture/config.yaml
#   4. the file named by --config
#   5. the compiled C configuration (see config.c), which runs last and can
#      compute values rather than state them
#   6. VENTURE_* environment variables
#   7. command-line options
#
# Anything secret -- API keys, the session secret, database passwords --
# should come from the environment or from a file referenced by path, never
# from this file. Every such setting has a *_env or *_file counterpart.

server:
  # Address to bind. Leave as loopback unless you have put authentication
  # and TLS in front of it: this API can move money figures around.
  bind_address: "127.0.0.1"
  port: 8747

  # The externally-visible base URL, used to build absolute links in
  # newsletters and webhooks. Leave empty to derive it from the request.
  base_url: ""

  # Optional TLS. When both are set the server speaks HTTPS directly.
  tls_certificate: ""
  tls_private_key: ""

  # Early body limit in MiB, counted from received chunks, including chunked uploads.
  max_request_size_mb: 32

  # Absolute receive deadline (including headers/TLS) and keep-alive idle time.
  # Does not preempt synchronous application handlers. Restart to change limits.
  request_timeout: 60

  # Per-listener accepted connections, including idle and TLS handshakes.
  max_connections: 128

  # Aggregate body bytes awaiting dispatch; must cover one maximum body.
  max_buffered_request_mb: 64

database:
  # sqlite:///absolute/path.db, sqlite://relative/path.db, sqlite://:memory:
  # postgres://user@host/dbname   (password from the environment, see below)
  #
  # The default keeps the database beside the rest of the runtime state, so
  # a fresh run needs no setup and no server.
  uri: "sqlite://venture.db"

  # Environment variable holding the database password, for backends that
  # need one. Never put the password itself in this file.
  password_env: "VENTURE_DB_PASSWORD"

  # Connections held open. SQLite ignores this; PostgreSQL uses it.
  pool_size: 4

  # Apply pending schema migrations automatically at startup. Safe for a
  # single-operator install; turn it off if you want to run migrations as a
  # deliberate, separate step.
  auto_migrate: true

  # Seconds to wait for a lock before giving up.
  busy_timeout: 5

security:
  # Require authentication for every request. Turning this off is only
  # sensible for a throwaway local instance -- with it off, anything that
  # can reach the port can read and change your financial records.
  require_auth: true

  # Environment variable holding the secret used to sign session cookies.
  # If it is unset, a random secret is generated at startup, which means
  # sessions do not survive a restart.
  session_secret_env: "VENTURE_SESSION_SECRET"

  # How long a browser session stays valid, in seconds. Default is 14 days.
  session_lifetime: 1209600

  # Mark the session cookie Secure. Required when served over HTTPS;
  # prevents the cookie working at all over plain HTTP.
  cookie_secure: false

  # Number of PBKDF2 iterations for password hashing. Raise it on faster
  # hardware; existing hashes record the count they were made with, so
  # changing this does not invalidate them.
  password_iterations: 210000

  # Shortest password accepted when one is set or changed.
  #
  # Eight suits the usual case: a single operator, bound to loopback, behind
  # whatever already guards the machine. Set it to 1 to turn the check off
  # entirely. Raise it if you ever put this on a network -- at that point the
  # password is the only thing between a stranger and your books.
  password_min_length: 8

  # Reject more than this many failed logins from one address per minute.
  login_rate_limit: 10

  # Environment variable holding the key that encrypts stored second-factor
  # secrets; falls back to session_secret_env when unset.
  mfa_key_env: "VENTURE_MFA_KEY"

locale:
  # The currency assumed when an amount does not name one.
  default_currency: "USD"

  # IANA timezone used to interpret dates and to bucket reports by day.
  timezone: "America/New_York"

  # The month a fiscal year starts in, 1-12. January for most people; set it
  # to match whatever your accountant uses.
  fiscal_year_start_month: 1

ai:
  # AI is a first-class participant: it answers questions about the data,
  # drafts records, and runs scheduled workflows. It is on by default but
  # inert until a provider has credentials.
  enabled: true

  # claude | openai | gemini | grok | ollama | claude-code | opencode
  provider: "claude"
  model: "claude-sonnet-5"

  # Environment variable holding the API key. Left empty, the provider's own
  # conventional variable is used (ANTHROPIC_API_KEY, OPENAI_API_KEY, ...).
  # provider, model and api_key_env are legacy hints; each organization
  # binds its own provider explicitly in its settings.
  api_key_env: ""

  # Exact platform-approved alternate provider base URLs; HTTPS unless
  # explicit loopback testing is enabled. Empty means only the built-in
  # provider endpoints are reachable.
  allowed_base_urls: []

  # Permit literal HTTP loopback endpoints from the exact AI base URL
  # allowlist for isolated tests. Never turn this on in production.
  allow_loopback: false

  # Total provider deadline, 1 through 60 seconds, below the durable
  # reservation lease.
  provider_deadline_seconds: 60

  # How much authority tool calls have:
  #   read_only       query and report, never mutate
  #   confirm_writes  mutations are staged and must be approved  (default)
  #   autonomous      mutations apply immediately
  #
  # confirm_writes is the default deliberately. A hallucinated tool call
  # that rewrites an expense is a tax problem, not a UI annoyance.
  policy: "confirm_writes"

  # Tools that may run without confirmation even under confirm_writes.
  # These are all read-only.
  auto_approve_tools:
    - "venture_query"
    - "venture_get"
    - "venture_report"
    - "venture_list_types"
    - "venture_search"

  # Seconds a staged mutation waits for a decision before expiring.
  confirmation_ttl: 3600

  # Most staged changes that may wait at once; further staging is refused.
  confirmation_limit: 200

  max_tokens: 4096

  # Seconds a single tool call may run.
  tool_timeout: 30

  # Turns the tool-use loop may take before it is cut off.
  max_turns: 12

  # Appended to the built-in system prompt. Put house rules here: which
  # entity is the default, how you name things, what never to touch.
  system_prompt_extra: ""

  # Record every AI request and response. Costs disk; worth it the first
  # time you need to know why a number changed.
  log_conversations: true

automation:
  # Scheduled automations, driven by an embedded podomation engine.
  enabled: true

  # The DSL file describing pods and bindings. Relative paths resolve
  # against the state directory.
  pods_file: "automations.pod"

  # Extra directories to load podomation modules from. The modules VENTURE
  # ships with are found automatically.
  module_paths: []

  # Seconds to allow in-flight automations to finish during shutdown.
  graceful_shutdown_timeout: 10

  # Persist engine state across restarts so a daily automation does not fire
  # twice because the process bounced.
  persist_state: true

forge:
  # Git forge integration: link tickets to repositories, file issues
  # upstream, create branches, and -- if you turn runs on below -- let an AI
  # do the work on a branch of its own.
  #
  # A forge is a record, not a setting, because there is usually more than
  # one and each carries a credential that has to be settable without a
  # restart. Add one at /e/forge; its access token and webhook secret are
  # set on that page rather than here, and neither is ever shown again.
  enabled: true

  # Seconds an outbound call to a forge may take. These calls happen inside
  # a request, so this is also the longest a button press can hang.
  request_timeout: 30

  # Accept inbound webhooks at /hooks/forge/<id>.
  #
  # That route is the only one in VENTURE that does not require a session.
  # It authenticates by verifying an HMAC over the request body against the
  # forge's webhook secret, and a forge with no secret set is refused
  # outright rather than trusted. Turn this off if you do not expose the
  # server to your forge.
  webhooks_enabled: true

  # Let rules start AI coding runs.
  #
  # Off by default, and deliberately the only part of this feature that is.
  # Everything else -- linking tickets to repositories, filing issues,
  # creating branches -- works with this off. This is the switch that lets
  # something spend money and push code without being watched, so turning it
  # on should be a decision rather than a default.
  runs_enabled: false

  # Coding runs in flight at once. Each one holds a checkout and a model
  # conversation; more than a couple is rarely useful on one machine.
  run_concurrency: 1

  # Seconds a run may take before it is abandoned, and turns it may take
  # before it is cut off. A rule can lower both; neither can be raised past
  # what is set here.
  run_timeout: 1800
  run_max_turns: 40

  # Where checkouts live, relative to the state directory. One directory per
  # run, removed when the run finishes.
  workspace_dir: "forge"

  # Hours a finished run's checkout is kept before it is swept up.
  workspace_retention_hours: 168

  # Keep the checkout of a run that failed. The usual reason a run fails is
  # something you want to look at, and the tree it left behind is the best
  # evidence there is.
  keep_failed_workspaces: true

  # The git executable, and how long any single invocation may take. A
  # clone of a large repository is the one that matters.
  git_path: "git"
  git_timeout: 600

  # Recorded as the author on commits a run makes, so they are
  # distinguishable from yours in the history rather than only in the audit
  # log.
  git_author_name: "VENTURE"
  git_author_email: "venture@localhost"

  # Commands the CLI runner may spawn. Exact matches only, never a prefix,
  # and never through a shell.
  #
  # A rule names the command it wants to run, and a rule is editable by
  # anybody who can edit rules. Without this list that is arbitrary command
  # execution with a longer fuse than the shell tool the AI is denied.
  # Empty means the CLI runner is unavailable, which is the default.
  cli_allowed_commands: []

  # Directories a harness session may work in directly, e.g.
  # - "/var/home/you/source/projects"
  #
  # Empty -- the default -- means a session may only work in a checkout it
  # cloned itself, under the workspace directory above. A path listed here
  # lets a session run a coding agent straight in a tree on this machine,
  # which is what somebody running VENTURE beside their own code wants and
  # is also write access to that tree, so it is switched on deliberately.
  # Paths are compared after resolution, so a symlink cannot walk out.
  workspace_roots: []

  # Seconds between run-status refreshes in the browser. The run page polls
  # a fragment; the fragment stops asking once the run has finished.
  poll_interval: 3

plugins:
  enabled: true

  # Directories scanned for native .so plugins. The build tree and the
  # install prefix are searched automatically.
  paths: []

  # Compile and load .c plugins on demand via crispy. This runs a compiler
  # over files in the plugin directories, so only enable it if you trust
  # what is in them -- which, for a personal install, you do.
  allow_crispy: true

  # Directories scanned for YAML venture-type definitions. These add new
  # kinds of venture with their own fields, metrics and report columns
  # without any code at all.
  venture_type_paths: []

  # Plugins that must load successfully or startup fails. Everything else
  # is best-effort and logs a warning.
  required: []

modules:
  # Every module VENTURE is made of can be switched off here, as one thing:
  # its record types disappear from the API, the UI, the schema, the AI
  # tools and venturectl; its reports leave the reports page; its pages
  # answer 404; and its services are never built. Nothing is deleted. A
  # table a module created stays where it is, and turning the module back
  # on shows the same rows.
  #
  # A module that requires one you have turned off is refused at startup
  # with a message naming both, rather than left half-working. The graph:
  #
  #   core (always on)
  #     sales          products, inventory, sales
  #       finance      expenses, accounts, ledger, tax; the P&L reports
  #         invoicing  invoices (also needs crm)
  #       outreach     campaigns, newsletters, subscribers, posts
  #     crm            companies, contacts, interactions, deals
  #     ideas          ideas, research notes
  #     kb             knowledge bases           (also: kb.enabled)
  #     tickets        tickets, comments, relations
  #       forge        repositories, rules, runs (also: forge.enabled)
  #         factory    milestones, releases, builds, environments,
  #                    deployments, incidents
  #     ai             the assistant             (also: ai.enabled)
  #       chat         stored conversations
  #     automation     the podomation engine     (also: automation.enabled)
  #     plugins        plugins and venture types (also: plugins.enabled)
  #     dashboards     pages of widgets you build
  #
  # The older *.enabled switches still work and mean the same thing; both
  # have to be true for the module to be on. Prefer this section.
  #
  # Either spelling is accepted:
  #
  #   crm: false
  #   crm:
  #     enabled: false
  #
  # `venture --list-modules` prints the resolved table for a configuration
  # without starting anything, and `venture --disable-module NAME` turns
  # one off for a single run. A plugin may add modules of its own, which
  # are switched here the same way.
  {}

ui:
  # system | light | dark | mocha. "system" follows the browser's
  # preference; "mocha" is Catppuccin Mocha. Whatever is set here is the
  # default until a person picks one with the toggle, which is remembered
  # per browser.
  theme: "system"

  # classic | industrial. Which of the two designs the pages are drawn
  # in: "classic" is the editorial look -- serif titles, white cards on a
  # bone canvas -- and "industrial" is the instrument panel -- monospace
  # labels, hard rules, one red. Both carry every theme above. This is the
  # default until a person picks one with the switch in the sidebar, which
  # is remembered per browser.
  look: "industrial"

  # Accent colour. It tints links, the focus ring and the active nav row --
  # primary buttons are ink regardless, so this is a highlight colour
  # rather than a brand fill. Empty means each look keeps its own: the
  # classic look's blue (#1f6c9f), the industrial look's hazard red
  # (#e61919). Set a hex colour to use it in both. The dark themes lighten
  # whatever is set here rather than substituting their own.
  accent: ""

  # Rows per page in list views.
  page_size: 50

  # Show the AI chat dock at the bottom of every page.
  chat_dock: true

  # Start the chat dock expanded rather than collapsed.
  chat_dock_expanded: false

  # Title shown in the header and the browser tab.
  title: "VENTURE"

logging:
  # error | warning | info | debug
  level: "info"

  # Empty means stderr, which is what you want under systemd.
  file: ""

  # text | json. JSON if you are shipping these somewhere that parses them.
  format: "text"

  # Log every request line.
  access_log: true

# Private by default. See docs/federation.org before exchanging public keys.
federation:
  enabled: false
  mode: allowlist
  origin: ""             # May differ from server.base_url; exact HTTPS origin.
  key_file: ""           # Owner-only Ed25519 PEM identity, separate from TLS.
  ca_file: ""            # Empty uses system trust; never disables verification.
  sync_interval: 60      # One local replica per interval; 0 means manual only.

# Transactional SMTP. The password is resolved only from this variable NAME.
mail:
  # Operator-allowed organization SMTP host:port pairs, comma-separated.
  # Deny by default: empty denies every organization-bound SMTP account.
  allowed_endpoints: ""
  # Operator-owned SMTP CA bundle; empty uses system trust.
  tls_ca_file: ""
  host: ""
  port: 587
  security: starttls                 # starttls | tls | none
  username: ""                       # empty disables authentication
  password_env: VENTURE_SMTP_PASSWORD
  from_address: ""
  from_name: Venture
  reply_to: ""

# Knowledge bases: documents the assistant can read, indexed by meaning.
# The embedding_* keys are legacy migration hints only; organization
# settings bind the embedding provider, URL, model and key explicitly, and
# ambient credentials are never used.
kb:
  # Whether knowledge bases and retrieval are available (also: modules.kb).
  enabled: true
  embedding_provider: "ollama"
  embedding_url: "http://127.0.0.1:11434"
  embedding_model: "nomic-embed-text:v1.5"
  embedding_key_env: ""

  # Target passage length in characters, and how many characters each
  # passage repeats from the previous one.
  chunk_chars: 1200
  chunk_overlap: 200

  # Passages returned by a search, and given to the assistant.
  search_limit: 8

  # Cosine similarity, as a percentage, below which a cross-reference is not
  # recorded, and the most cross-references recorded for one record.
  crossref_min_score: 60
  crossref_max_links: 5

  # Largest file accepted by an import, in MiB, and the most files taken
  # from a single uploaded archive.
  max_upload_mb: 64
  max_archive_entries: 2000

# Scheduled backups. See docs/backup.org.
backup:
  # Where scheduled backups are written when a schedule names no
  # destination; relative to the state directory.
  directory: "backups"

  # Successful backups kept per schedule when the schedule says zero.
  retention: 7

# Opt-in module switches. Each is off by default and means the same as the
# matching entry under modules: above; both have to be true for the module
# to be on. Uncomment to enable.
#
# Hosted Stripe payments; requires deployment credentials. See docs/stripe.org.
# stripe:
#   enabled: false
#
# Imported payroll runs; native tax calculation is out of scope.
# payroll:
#   enabled: false
#
# Pluggable bank feeds; each organization binds its own provider
# credentials in settings. See docs/bankfeed.org.
# bankfeed:
#   enabled: false
#
# Commerce connectors with explicit organization account settings.
# commerce:
#   enabled: false
#
# Intercompany links, eliminations and consolidated statements.
# group:
#   enabled: false

# Bounded local OCR for captured receipts and PDFs. Off by default; enabling
# it requires the local engine described in docs/ocr.org.
# ocr:
#   # Enable bounded local OCR explicitly.
#   enabled: false
#   # Local OCR executable, chosen by the operator.
#   executable: "tesseract"
#   # Installed OCR languages joined with +.
#   language: "eng"

# Organization OpenID Connect sign-in. Off by default; see docs/oidc.org.
# oidc:
#   # Enable explicitly linked organization OpenID Connect sign-in.
#   enabled: false
#   # Permit HTTP loopback issuers only for isolated test deployments.
#   allow_loopback: false
#   # Exact platform-approved issuer URLs. Deny by default: empty refuses
#   # all providers, so every issuer must be listed here.
#   allowed_issuers: []

# Operator allowlists for private mailbox and calendar connectors. Both are
# deny by default: an empty value denies every endpoint, so an organization
# or member-bound IMAP or CalDAV account cannot sync until its host is
# listed here. See docs/connectors.org.
# imap:
#   # Operator-allowed IMAP host:port pairs, comma-separated; empty denies all.
#   allowed_endpoints: ""
# calendar:
#   # Operator-allowed CalDAV HTTPS origins, comma-separated; empty denies all.
#   allowed_origins: ""
# connectors:
#   # Allow explicitly configured loopback IMAP fixtures without TLS; never
#   # permits remote plaintext.
#   allow_plaintext_loopback: false

# Hosted workspace binding. Written by the platform operator tooling for a
# tenant process (see docs/hosted-workspaces.org); a self-hosted install
# leaves this alone.
# hosted:
#   # Pin this database to one hosted workspace.
#   enabled: false
#   # Immutable hosted workspace UUID.
#   workspace_id: ""
#   # Immutable public HTTPS tenant origin.
#   origin: ""
#   # Workspace dynamic HTTP requests per minute, 1 through 1000000.
#   http_requests_per_minute: 600
#   # Workspace dynamic HTTP burst capacity, 1 through 1000000.
#   http_burst: 120
#   # Maximum nested dynamic HTTP handlers, 1 through 256.
#   http_concurrency: 8

# The rendered documentation site served at /docs. The default is the
# docs-site directory under the install prefix's data directory.
# docs:
#   site_dir: "/usr/local/share/venture/docs-site"
